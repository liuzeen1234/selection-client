plugins {
    id "fabric-loom" version "1.5-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.aliyun.com/repository/central" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 测试依赖
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

// 运行时强制 UTF-8，避免 Windows 下中文乱码
loom {
    runs {
        client {
            vmArgs "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
        }
    }
}

test {
    useJUnitPlatform()
}

java {
    // 固定编译 / 测试 / 运行（含 runClient 游戏本体）所用的 JDK 为 17。
    // Gradle 会按此 toolchain 自动定位本机的 JDK 17；找不到时可由 gradle.properties 中的
    // org.gradle.java.home 兜底（该项同时也决定 Gradle 守护进程本身用哪个 JDK）。
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}



