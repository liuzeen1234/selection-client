plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.21" apply false
    id "net.fabricmc.fabric-loom" version "1.17.21" apply false
    id "maven-publish"
}

// Like debug_menu, each Minecraft target gets its own dependencies and jar.
ext.supportedVersions = [
    '1.20.4': [loader: '0.15.11', api: '0.95.4+1.20.4', java: 17],
    '26.2': [loader: '0.19.3', api: '0.161.0+26.2', java: 25]
]
def mcTarget = (findProperty('mc') ?: property('default_mc')).toString()
def target = supportedVersions[mcTarget]
if (target == null) {
    throw new GradleException("Unsupported Minecraft target ${mcTarget}. Supported: ${supportedVersions.keySet().join(', ')}")
}
def modern = mcTarget == '26.2'
apply plugin: modern ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
logger.lifecycle("[selection-client] building for Minecraft ${mcTarget}")
version = project.mod_version
group = project.maven_group
base { archivesName = "${project.archives_base_name}-mc${mcTarget}" }
layout.buildDirectory = file("build/targets/${mcTarget}")
sourceSets.main.java.setSrcDirs(modern ? ['src/mc26.2/java'] : ['src/main/java'])
sourceSets.test.java.setSrcDirs(modern ? ['src/mc26.2/test'] : ['src/test/java'])

repositories {
    // Mojang libraries are enumerated by the game manifest, including their dependencies.
    exclusiveContent {
        forRepository {
            maven {
                name = "MojangTarget"
                url = "https://libraries.minecraft.net/"
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'com.mojang' }
    }
    exclusiveContent {
        forRepository {
            maven { name = "FabricTarget"; url = "https://maven.fabricmc.net/" }
        }
        filter { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
    }
    maven { url "https://maven.aliyun.com/repository/central" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcTarget}"
    if (!modern) mappings "net.fabricmc:yarn:1.20.4+build.3:v2"
    add(modern ? "implementation" : "modImplementation", "net.fabricmc:fabric-loader:${target.loader}")
    add(modern ? "implementation" : "modImplementation", "net.fabricmc.fabric-api:fabric-api:${target.api}")

    // 测试依赖
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
}

processResources {
    inputs.property "version", "${project.version}+mc${mcTarget}"
    inputs.property "minecraft_dependency", "~${mcTarget}"
    inputs.property "loader_dependency", ">=${target.loader}"
    inputs.property "java_dependency", ">=${target.java}"
    filesMatching("fabric.mod.json") {
        expand version: "${project.version}+mc${mcTarget}",
                minecraft_dependency: "~${mcTarget}",
                loader_dependency: ">=${target.loader}", java_dependency: ">=${target.java}"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = target.java
    it.options.encoding = "UTF-8"
}

// 运行时强制 UTF-8，避免 Windows 下中文乱码
loom {
    runs {
        client {
            runDir "run/${mcTarget}"
            vmArgs "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
        }
    }
}

test {
    useJUnitPlatform()
    // Minecraft's logging must stay in the ignored build directory during tests.
    workingDir = layout.buildDirectory.dir('test-runtime').get().asFile
    doFirst { workingDir.mkdirs() }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(target.java)
    }
    withSourcesJar()
}




// Collect installable jars without overwriting the other target.
if (modern) {
    tasks.named('jar', Jar) { destinationDirectory = file('build/libs') }
    tasks.named('sourcesJar', Jar) { destinationDirectory = file('build/libs') }
} else {
    tasks.named('remapJar') { destinationDirectory = file('build/libs') }
    tasks.named('remapSourcesJar') { destinationDirectory = file('build/libs') }
}
