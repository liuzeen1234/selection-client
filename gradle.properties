# 强制 UTF-8 编码，避免 Windows 下中文乱码
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8

# Gradle 9.5.1 / Loom 1.17 run on Java 25; old targets still compile with Java 17.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@17,/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
org.gradle.java.installations.auto-download=false

default_mc=1.20.4

# Mod Properties
mod_version=1.0.0
maven_group=com.example.selectionclient
archives_base_name=selection-client


# 代理配置：fabric-loom 等插件需通过局域网代理下载。
# 项目级配置优先级高于全局 ~/.gradle/gradle.properties，直接 ./gradlew runClient 即走此代理。
systemProp.http.proxyHost=192.168.1.19
systemProp.http.proxyPort=7896
systemProp.http.nonProxyHosts=127.0.0.1|localhost
systemProp.https.proxyHost=192.168.1.19
systemProp.https.proxyPort=7896
systemProp.https.nonProxyHosts=127.0.0.1|localhost
